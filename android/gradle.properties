# This VPS OOMs on parallel Gradle builds — keep everything in ONE lean JVM:
# no daemon, no parallel, and the Kotlin compiler runs in-process (a separate
# Kotlin daemon once pushed the box over the edge mid-packaging).
org.gradle.jvmargs=-Xmx1792m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
